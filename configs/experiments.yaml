# Общие параметры, используемые всеми экспериментами.
defaults:
  # Датасет для всех экспериментов:
  #   mnist
  #   fashionmnist
  #   cifar10
  #   cifar100
  dataset: cifar100

  # Каталог для хранения датасетов.
  data-root: data

  # Доля клиентов, участвующих в обучении в каждом раунде.
  fraction-train: 1.0

  # Доля клиентов, участвующих в оценке модели в каждом раунде.
  fraction-evaluate: 1.0

  # Стратегия агрегации обновлений на сервере:
  #   fedavg        — обычное взвешенное усреднение (базовый вариант);
  #   fedavgm       — FedAvg с серверным momentum;
  #   fedadam       — адаптивная серверная оптимизация Adam;
  #   fedmedian     — покоординатная медиана, устойчивее к выбросам;
  #   fedtrimmedavg — усечённое среднее, отбрасывающее крайние значения.
  strategy: fedavg

  # Параметры FedAvgM и FedAdam.
  # Для FedAvgM используются server-learning-rate и server-momentum.
  # Для FedAdam используются server-learning-rate и параметры fedopt-*.
  server-learning-rate: 1.0
  server-momentum: 0.9
  fedopt-client-learning-rate: 0.1
  fedopt-beta-1: 0.9
  fedopt-beta-2: 0.99
  fedopt-tau: 0.001

  # Доля значений, отбрасываемая FedTrimmedAvg с каждого края.
  # Допустимый диапазон: от 0.0 включительно до 0.5 не включительно.
  trimmed-beta: 0.2

  # Скорость локального обучения.
  learning-rate: 0.01

  # Коэффициент momentum для SGD.
  momentum: 0.9

  # Коэффициент L2-регуляризации.
  weight-decay: 0.0001

  # Способ распределения данных между клиентами:
  #   iid       — примерно одинаковое распределение;
  #   dirichlet — неоднородное Non-IID-распределение.
  partition: dirichlet

  # Степень неоднородности Dirichlet-разбиения.
  # Чем меньше значение, тем сильнее различаются данные клиентов:
  #   10.0 — почти IID;
  #   1.0  — умеренная неоднородность;
  #   0.5  — заметная неоднородность;
  #   0.1  — сильная неоднородность.
  dirichlet-alpha: 0.5

  # Доля локальных данных клиента для валидации.
  val-fraction: 0.1

  # Доля вредоносных клиентов.
  # Фактическое количество зависит от общего числа клиентов и округления.
  malicious-fraction: 0.7

  # Первый раунд, в котором применяется атака.
  attack-start-round: 1

  # Последний раунд атаки.
  # Значение -1 означает применять атаку до конца эксперимента.
  attack-end-round: -1

  # Исходный класс для label flip и backdoor.
  # Значение -1 означает использовать все допустимые классы.
  label-source: -1
  # Целевой класс, в который атака переводит объекты.
  label-target: 0

  # Seed для воспроизводимости результатов.
  seed: 42

  # Количество CPU, выделяемых одному клиенту.
  client-cpus: 1

  # Количество GPU, выделяемых одному клиенту.
  client-gpus: 0.0

  # Количество глобальных раундов федеративного обучения.
  num-server-rounds: 10

  # Общее количество федеративных клиентов.
  num-clients: 5

  # Количество локальных эпох клиента за один раунд.
  local-epochs: 2

  # Размер батча при локальном обучении.
  batch-size: 64


# Набор доступных экспериментов.
# Параметры внутри эксперимента переопределяют значения из defaults.
experiments:

  # Контрольный эксперимент без вредоносных действий.
  # Используется как baseline для сравнения с атаками.
  - name: clean
    attack: none

  # Атака подмены меток.
  # Вредоносные клиенты изменяют метки локальных обучающих объектов.
  - name: label_flip
    attack: label_flip

  # Атака на обновления модели.
  # Вредоносные клиенты инвертируют направление локального обновления и усиливают его перед отправкой на сервер.
  - name: sign_flip
    attack: sign_flip

    # Коэффициент усиления вредоносного обновления.
    model-attack-scale: 2.0

  # Backdoor-атака.
  # В часть изображений добавляется триггер, после чего им назначается целевой класс.
  - name: backdoor
    attack: backdoor

    # Отравлять 40% подходящих локальных примеров.
    poison-fraction: 0.4

  # Атака с добавлением гауссовского шума.
  # Вредоносные клиенты добавляют шум к обновлениям модели.
  - name: gaussian_noise
    attack: gaussian_noise

    # Стандартное отклонение добавляемого шума.
    noise-std: 2.0