# Общие параметры, применяемые ко всем экспериментам.
defaults:
  # Набор данных для обучения и оценки модели.
  # Допустимые значения: mnist | fashionmnist | cifar10 | cifar100.
  dataset: cifar100

  # Каталог, в котором хранятся/скачиваются файлы датасета.
  # Допустимое значение: любой корректный путь к каталогу.
  data-root: data

  # Доля доступных клиентов, выбираемых для локального обучения в каждом раунде.
  # Допустимый диапазон: 0.0 <= fraction-train <= 1.0.
  fraction-train: 1.0

  # Доля доступных клиентов, выбираемых для локальной оценки в каждом раунде.
  # Допустимый диапазон: 0.0 <= fraction-evaluate <= 1.0.
  fraction-evaluate: 1.0

  # Стратегия серверной агрегации обновлений клиентов.
  # Допустимые значения:
  #   fedavg        — обычное взвешенное усреднение;
  #   fedavgm       — FedAvg с серверным momentum;
  #   fedadam       — серверная оптимизация Adam;
  #   fedmedian     — покоординатная медиана;
  #   fedtrimmedavg — усечённое среднее.
  strategy: fedavg

  # Скорость обновления глобальной модели на сервере.
  # Используется только в fedavgm и fedadam.
  # Допустимый диапазон: server-learning-rate > 0.0.
  server-learning-rate: 1.0

  # Серверный momentum.
  # Используется только в fedavgm.
  # Допустимый диапазон: 0.0 <= server-momentum < 1.0.
  server-momentum: 0.9

  # Клиентская скорость обучения eta_l в FedAdam/FedOpt.
  # Используется только в fedadam.
  # Допустимый диапазон: fedopt-client-learning-rate > 0.0.
  fedopt-client-learning-rate: 0.1

  # Коэффициент beta_1 для первого момента в FedAdam.
  # Используется только в fedadam.
  # Допустимый диапазон: 0.0 <= fedopt-beta-1 < 1.0.
  fedopt-beta-1: 0.9

  # Коэффициент beta_2 для второго момента в FedAdam.
  # Используется только в fedadam.
  # Допустимый диапазон: 0.0 <= fedopt-beta-2 < 1.0.
  fedopt-beta-2: 0.99

  # Стабилизирующая константа tau в FedAdam, предотвращающая деление на ноль.
  # Используется только в fedadam.
  # Допустимый диапазон: fedopt-tau > 0.0.
  fedopt-tau: 0.001

  # Доля крайних значений, отбрасываемых с каждого края при FedTrimmedAvg.
  # Используется только в fedtrimmedavg.
  # Допустимый диапазон: 0.0 <= trimmed-beta < 0.5.
  trimmed-beta: 0.2

  # Скорость локального обучения модели на каждом клиенте.
  # Допустимый диапазон: learning-rate > 0.0.
  learning-rate: 0.01

  # Momentum локального SGD-оптимизатора.
  # Допустимый диапазон: 0.0 <= momentum < 1.0.
  momentum: 0.9

  # Коэффициент L2-регуляризации (weight decay) локального оптимизатора.
  # Допустимый диапазон: weight-decay >= 0.0.
  # 0.0 = регуляризация отключена.
  weight-decay: 0.0001

  # Количество локальных эпох обучения клиента за один серверный раунд.
  # Допустимый диапазон: целое число >= 1.
  local-epochs: 2

  # Размер мини-батча при локальном обучении и оценке.
  # Допустимый диапазон: целое число >= 1.
  batch-size: 64

  # Способ распределения обучающих данных между клиентами.
  # Допустимые значения:
  #   iid       — примерно одинаковое распределение данных между клиентами;
  #   dirichlet — неоднородное Non-IID распределение по Dirichlet.
  partition: dirichlet

  # Параметр alpha распределения Dirichlet.
  # Используется только при partition: dirichlet.
  # Допустимый диапазон: dirichlet-alpha > 0.0.
  # Чем меньше alpha, тем сильнее неоднородность данных клиентов.
  # Примеры: 10.0 ≈ почти IID, 1.0 = умеренно, 0.5 = заметно, 0.1 = сильно Non-IID.
  dirichlet-alpha: 0.5

  # Доля локальных данных каждого клиента, выделяемая под валидацию.
  # Допустимый диапазон: 0.0 < val-fraction < 1.0.
  val-fraction: 0.1

  # Доля клиентов, считающихся вредоносными в экспериментах с атакой.
  # Допустимый диапазон: 0.0 <= malicious-fraction <= 1.0.
  # 0.7 = 70% клиентов вредоносные; фактическое число зависит от округления.
  malicious-fraction: 0.7

  # Первый серверный раунд, начиная с которого вредоносные клиенты применяют атаку.
  # Допустимый диапазон: целое число >= 1.
  attack-start-round: 1

  # Последний серверный раунд, в котором применяется атака.
  # Допустимые значения: -1 либо целое число >= attack-start-round.
  # -1 = атака действует до конца эксперимента.
  attack-end-round: -1

  # Seed генераторов случайных чисел для воспроизводимости экспериментов.
  # Допустимый диапазон: целое число >= 0.
  seed: 42

  # Количество CPU, резервируемое для одного клиента Flower.
  # Допустимый диапазон: число > 0.
  client-cpus: 1

  # Количество GPU, резервируемое для одного клиента Flower.
  # Допустимый диапазон: число >= 0.0.
  # 0.0 = GPU-ресурс через Flower для клиента не резервируется;
  # дробное значение, например 0.2, позволяет делить один GPU между клиентами.
  client-gpus: 0.0

  # Количество глобальных раундов федеративного обучения.
  # Допустимый диапазон: целое число >= 1.
  num-server-rounds: 10

  # Общее количество федеративных клиентов.
  # Допустимый диапазон: целое число >= 1.
  num-clients: 5


# Эксперименты отличаются видом воздействия на обновление модели.
# Параметры, относящиеся только к конкретной атаке, находятся только в её блоке.
experiments:

  # Контрольный эксперимент без атаки.
  # Уникальное имя эксперимента.
  # Допустимое значение: непустая строка; имя должно быть уникальным в списке.
  - name: clean

    # Тип атаки.
    attack: none

  # Sign Flip: вредоносный клиент инвертирует направление честного обновления.
  # Формула: Δw_attack = -model-attack-scale * Δw.
  - name: sign_flip

    # Тип атаки.
    attack: sign_flip

    # Множитель инвертированного обновления.
    # Допустимый диапазон: model-attack-scale > 0.0.
    # 1.0 = только смена знака; > 1.0 = дополнительно усиливает вредоносное обновление.
    model-attack-scale: 2.0

  # Gaussian Noise: к честному обновлению добавляется гауссовский шум.
  # Масштаб шума задаётся относительно RMS честного обновления.
  - name: gaussian_noise

    # Тип атаки.
    attack: gaussian_noise

    # Относительная интенсивность гауссовского шума.
    # Допустимый диапазон: noise-std >= 0.0.
    # 0.0 = атака фактически отключена; чем больше значение, тем сильнее шум.
    noise-std: 2.0

  # Scaling: вредоносный клиент умножает честное обновление на коэффициент.
  # Формула: Δw_attack = scaling-factor * Δw.
  - name: scaling

    # Тип атаки.
    attack: scaling

    # Коэффициент масштабирования локального обновления.
    # Допустимый диапазон для атаки: scaling-factor > 0.0.
    # 1.0 = обновление не меняется; > 1.0 = обновление усиливается.
    scaling-factor: 10.0

  # Random Update: честное направление обновления заменяется случайным вектором.
  # Норма случайного вектора масштабируется относительно нормы честного Δw.
  - name: random_update

    # Тип атаки.
    # Допустимое значение для этого эксперимента: random_update.
    attack: random_update

    # Множитель нормы случайного обновления относительно нормы честного обновления.
    # Допустимый диапазон: random-update-scale >= 0.0.
    # 0.0 = нулевое обновление; 1.0 = та же норма, что у честного; > 1.0 = усиленная атака.
    random-update-scale: 2.0